<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>AI Tab Organizer PoC</title>
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; width: 420px; margin: 0; padding: 14px; background: #f8fafc; color: #0f172a; }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { font-size: 12px; color: #475569; margin: 0 0 12px; line-height: 1.45; }
    button { border: 0; border-radius: 10px; padding: 9px 12px; cursor: pointer; font-weight: 600; }
    .primary { background: #2563eb; color: white; }
    .secondary { background: #e2e8f0; color: #0f172a; }
    .danger { background: #fee2e2; color: #991b1b; }
    .row { display: flex; gap: 8px; margin-bottom: 12px; }
    .group { background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 10px; margin: 8px 0; }
    .group-title { font-weight: 700; font-size: 14px; margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between; }
    .count { color: #64748b; font-size: 12px; font-weight: 500; }
    ul { padding-left: 18px; margin: 6px 0 0; }
    li { font-size: 12px; margin: 4px 0; color: #334155; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .status { font-size: 12px; color: #475569; margin-top: 8px; }
    .option { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #334155; margin-bottom: 10px; }
  </style>
</head>
<body>
  <h1>AI Tab Organizer PoC</h1>
  <p>整理当前窗口标签页：先生成分组预览，确认后再创建 Chrome Tab Groups。</p>

  <label class="option">
    <input id="skipPinned" type="checkbox" checked />
    跳过固定标签页 / chrome:// / 扩展页
  </label>

  <div class="row">
    <button id="previewBtn" class="primary">生成分组预览</button>
    <button id="applyBtn" class="secondary" disabled>应用分组</button>
    <button id="clearBtn" class="danger">清空预览</button>
  </div>

  <div id="preview"></div>
  <div id="status" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
