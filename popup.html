<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>AI Tab Organizer</title>
  <style>
    :root { --blue:#2563eb; --bg:#f8fafc; --line:#e5e7eb; --text:#111827; --muted:#6b7280; --soft:#f1f5f9; }
    body { width: 540px; max-height: 760px; overflow: auto; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
    .head { padding: 16px 16px 12px; background: linear-gradient(180deg,#fff,#f8fafc); border-bottom: 1px solid var(--line); }
    h1 { margin: 0; font-size: 18px; }
    .sub { margin-top: 6px; color: var(--muted); font-size: 12.5px; line-height: 1.45; }
    .panel { padding: 14px 16px; }
    .settings-card { display:flex; align-items:center; justify-content:space-between; gap:10px; background:#eef6ff; border:1px solid #bfdbfe; border-radius:14px; padding:10px 12px; margin-bottom:12px; }
    .settings-title { font-size:14px; font-weight:800; color:#1e3a8a; }
    .settings-sub { font-size:12px; color:#475569; margin-top:2px; line-height:1.35; }
    .row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
    button { border: 0; border-radius: 10px; padding: 9px 11px; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .primary { background: var(--blue); color: #fff; }
    .secondary { background: #e5e7eb; color: #111827; }
    .danger { background: #fee2e2; color: #991b1b; }
    .ghost { background: transparent; color: var(--blue); padding: 6px 0; }
    .settings-btn { background:#2563eb; color:white; white-space:nowrap; padding:9px 12px; box-shadow:0 6px 16px rgba(37,99,235,.18); }
    .stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; margin: 12px 0; }
    .stat { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 9px; text-align: center; }
    .num { font-size: 18px; font-weight: 800; }
    .label { font-size: 11px; color: var(--muted); margin-top: 2px; }
    label { font-size: 13px; color: #374151; }
    select, input[type="number"] { border: 1px solid #d1d5db; border-radius: 8px; padding: 6px 8px; background: white; }
    .status { color: var(--muted); font-size: 12.5px; line-height: 1.45; margin-top: 8px; min-height: 18px; }
    .error { color: #b91c1c; }
    .ok { color: #047857; }
    .sep { border-top: 1px solid var(--line); margin: 12px 0; }
    .small { font-size: 12px; color: var(--muted); }
    .group { background: white; border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 10px; }
    .group.unclassified { background:#fffdf7; border-color:#fde68a; }
    .group.live { border-color:#bfdbfe; }
    .ghead { display: flex; gap: 8px; align-items: center; }
    .gname { flex: 1; border: 1px solid #d1d5db; border-radius: 9px; padding: 7px 8px; font-weight: 700; min-width: 0; }
    .color { width: 78px; }
    .badge { border-radius:999px; background:#eff6ff; color:#1d4ed8; padding:3px 7px; font-size:11px; font-weight:800; }
    .reason { color: #4b5563; background: #f3f4f6; border-radius: 9px; padding: 7px 8px; font-size: 12px; margin-top: 8px; line-height: 1.4; }
    .tab-list { margin: 9px 0 0 0; padding: 4px; min-height: 34px; max-height: 170px; overflow: auto; border: 1px dashed transparent; border-radius: 10px; }
    .tab-list.drag-over { border-color:#60a5fa; background:#eff6ff; }
    .tab-item { list-style: none; display:flex; align-items:center; gap:7px; font-size: 12.5px; margin: 5px 0; padding: 7px 8px; color: #374151; background:#f8fafc; border:1px solid #edf2f7; border-radius:10px; cursor: grab; }
    .tab-item:active { cursor: grabbing; }
    .tab-item.selected { outline:2px solid #93c5fd; background:#eff6ff; }
    .title-wrap { min-width:0; flex:1; }
    .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 380px; display:block; }
    .move-btn { opacity: 0; transition:.12s; border:1px solid #dbeafe; color:#1d4ed8; background:#fff; padding:4px 7px; border-radius:8px; font-size:12px; }
    .tab-item:hover .move-btn, .tab-item.selected .move-btn { opacity: 1; }
    .move-select { max-width: 148px; padding: 4px 6px; font-size:12px; }
    .empty-drop { color:#94a3b8; font-size:12px; padding:8px; }
  </style>
</head>
<body>
  <div class="head">
    <h1>AI Tab Organizer</h1>
    <div class="sub">v0.5：支持分组预览微调、页签拖拽移动、应用后同步当前 Chrome 分组。</div>
  </div>
  <div class="panel">
    <div class="settings-card">
      <div>
        <div class="settings-title">AI 设置</div>
        <div class="settings-sub">配置模型接口、自定义规则和性能参数</div>
      </div>
      <button id="optionsBtn" class="settings-btn">打开设置</button>
    </div>
    <div class="row">
      <label>分组模式</label>
      <select id="mode">
        <option value="ai" selected>AI 语义模式</option>
        <option value="rule">规则模式</option>
      </select>
      <label>最小成组</label>
      <input id="minSize" type="number" min="1" max="10" value="2" style="width:54px" />
    </div>
    <div class="row">
      <label><input id="onlyUngrouped" type="checkbox" checked /> 只整理未分组 tabs</label>
      <label><input id="skipPinned" type="checkbox" checked /> 跳过 pinned</label>
    </div>
    <div class="row">
      <button id="previewBtn" class="primary">生成分组预览</button>
      <button id="applyBtn" class="secondary" disabled>应用分组</button>
      <button id="syncBtn" class="secondary">同步当前分组</button>
      <button id="undoBtn" class="danger">撤销上次</button>
      <button id="ungroupAllBtn" class="danger">清除分组</button>
      <button id="cleanupBeforeUninstallBtn" class="danger">卸载</button>
    </div>
    <div id="status" class="status"></div>
    <div class="stats">
      <div class="stat"><div id="statTotal" class="num">0</div><div class="label">总 tabs</div></div>
      <div class="stat"><div id="statUsed" class="num">0</div><div class="label">纳入</div></div>
      <div class="stat"><div id="statSkipped" class="num">0</div><div class="label">跳过</div></div>
      <div class="stat"><div id="statGroups" class="num">0</div><div class="label">分组</div></div>
    </div>
    <div class="sep"></div>
    <div id="groups"></div>
    <div class="small">提示：预览阶段拖拽只调整计划；应用分组后拖拽会直接更新 Chrome 分组。也可以在 Chrome 标签栏手动拖动后点击“同步当前分组”。</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
