<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>AI Tab Organizer Settings</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; background: #f7f9fc; color: #1f2937; }
    .wrap { max-width: 780px; margin: 40px auto; background: white; border: 1px solid #e5e7eb; border-radius: 18px; padding: 28px; box-shadow: 0 12px 40px rgba(15,23,42,.08); }
    h1 { margin: 0 0 8px; font-size: 24px; }
    .sub { color: #6b7280; line-height: 1.5; margin-bottom: 24px; }
    label { display: block; margin-top: 18px; font-weight: 650; }
    input, textarea { width: 100%; box-sizing: border-box; margin-top: 8px; border: 1px solid #d1d5db; border-radius: 10px; padding: 11px 12px; font-size: 14px; background: #fff; }
    textarea { min-height: 72px; resize: vertical; }
    button { margin-top: 22px; padding: 11px 16px; border-radius: 10px; border: 0; background: #2563eb; color: white; font-weight: 700; cursor: pointer; }
    .secondary { background: #e5e7eb; color: #111827; margin-left: 8px; }
    .hint { color: #6b7280; font-size: 13px; margin-top: 6px; line-height: 1.4; }
    .status { margin-top: 16px; font-size: 14px; color: #047857; }
    code { background: #f3f4f6; padding: 2px 5px; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>AI Tab Organizer 设置</h1>
    <div class="sub">配置 OpenAI-compatible 模型、规则模式和性能参数。AI 模式只生成分组计划，插件本地校验、预览和执行。</div>

    <label>API Endpoint</label>
    <input id="endpoint" placeholder="https://api.deepseek.com/chat/completions" />

    <label>API Key</label>
    <input id="apiKey" type="password" placeholder="sk-..." />

    <label>Model</label>
    <input id="model" placeholder="deepseek-v4-flash / gpt-4.1-mini / your-model" />

    <label>System Prompt 附加约束</label>
    <textarea id="extraPrompt" placeholder="例如：中文分组名，优先按工作任务分组，购物页单独分组等"></textarea>

    <label>规则模式：自定义规则 JSON</label>
    <textarea id="customRules" style="min-height:260px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace"></textarea>
    <div class="hint">字段支持：<code>name</code>、<code>color</code>、<code>keywords</code>、<code>domains</code>、<code>urlPatterns</code>、<code>titleKeywords</code>。</div>

    <label><input id="groupByDomainFallback" type="checkbox" style="width:auto;margin-right:8px" /> 未命中规则时按域名兜底分组</label>

    <label><input id="enablePageSemantics" type="checkbox" style="width:auto;margin-right:8px" /> 启用页面语义增强</label>
    <div class="hint">默认关闭以保证大量 tabs 快速分组。开启后会限并发、限时、带缓存读取部分页面语义。</div>

    <label>页面正文片段长度</label>
    <input id="pageSnippetChars" type="number" min="200" max="1200" step="100" />

    <label>页面语义抽取上限 tabs</label>
    <input id="maxSemanticTabs" type="number" min="0" max="50" step="1" />

    <label>单页语义抽取超时 ms</label>
    <input id="semanticTimeoutMs" type="number" min="150" max="2000" step="50" />

    <label>页面语义缓存时间 min</label>
    <input id="semanticCacheTtlMinutes" type="number" min="1" max="1440" step="1" />

    <label>AI 最大请求超时 ms</label>
    <input id="aiRequestTimeoutMs" type="number" min="8000" max="30000" step="500" />
    <div class="hint">使用自适应超时：约 6000ms + 每个 tab 180ms，并受这里的最大超时限制。DeepSeek V4 建议 20000ms。</div>

    <button id="saveBtn">保存设置</button>
    <button id="clearBtn" class="secondary">清空 AI 设置</button>
    <button id="resetRulesBtn" class="secondary">恢复默认规则</button>
    <div id="status" class="status"></div>
  </div>
  <script src="options.js"></script>
</body>
</html>
